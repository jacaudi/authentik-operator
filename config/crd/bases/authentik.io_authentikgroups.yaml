---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: authentikgroups.authentik.io
spec:
  group: authentik.io
  names:
    kind: AuthentikGroup
    listKind: AuthentikGroupList
    plural: authentikgroups
    singular: authentikgroup
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.name
      name: Name
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.provenance
      name: Provenance
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuthentikGroup is the Schema for the authentikgroups API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AuthentikGroup
            properties:
              attributes:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  attributes are the group's attributes, inherited by its members in
                  claims. The operator owns only the keys listed here: it sets them, removes
                  a key it set earlier that is no longer listed, and keeps every other key
                  (Authentik's own and any set in its UI). An empty map removes the keys the
                  operator set; omitting the field releases them without deleting them.
                  Values are strings, numbers, booleans or lists. Keys starting with
                  goauthentik.io/, and authentik_operator and settings, are reserved: the
                  resource reports InvalidSpec and writes nothing.
                maxProperties: 64
                type: object
              authentikRef:
                description: |-
                  authentikRef names the AuthentikDeployment (same namespace) whose
                  connection this object is reconciled against. When omitted, the
                  operator's default connection is used.
                properties:
                  name:
                    description: |-
                      name of an AuthentikDeployment in the same namespace. Cross-namespace
                      references are deliberately not supported: the referenced deployment
                      carries an API token, and referencing it grants its privileges.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: |-
                  deletionPolicy is what happens to the object in Authentik when this
                  resource is deleted: Delete or Retain. When unset: Delete for an object
                  this resource created, Retain for an adopted one or one of undecided
                  provenance. An explicit Delete always wins, so it can remove an object
                  this resource did not create; a Warning event is emitted when it does so
                  for undecided provenance. ReadOnly never deletes (Delete is rejected).
                  The rendered credentials Secret is a Kubernetes object owned by this
                  resource and is garbage-collected with it under either policy.
                enum:
                - Delete
                - Retain
                type: string
              dryRun:
                description: |-
                  dryRun finds the existing object and reports, in the Ready condition
                  (reason AdoptionDryRun) and an event, which fields adoption would
                  change. Nothing is written to Authentik, and no credentials Secret is
                  rendered. Set it back to false to adopt for real. Only with
                  managementPolicy Adopt or AdoptOrCreate. dryRun gates only the initial
                  takeover (and the decision to create under AdoptOrCreate): once the
                  object is adopted, spec edits are applied live whatever dryRun says.
                type: boolean
              isSuperuser:
                description: |-
                  isSuperuser makes the group's users superusers. Unset: held to false on a
                  group this resource created, the live value on an adopted group.
                type: boolean
              managementPolicy:
                default: Create
                description: |-
                  managementPolicy is how this resource relates to the object in
                  Authentik. Create (the default) creates it and treats an existing one as
                  a Conflict. Adopt takes over an existing object and never creates one.
                  AdoptOrCreate adopts if the object exists and creates it if not.
                  ReadOnly finds the existing object, renders the credentials Secret and
                  reports drift in the Drifted condition, and never writes to Authentik
                  or deletes the object. Adopt, AdoptOrCreate and ReadOnly on the
                  operator's default connection need an administrator to allow the
                  namespace (--default-connection-adoption-namespace-selector); with
                  spec.authentikRef they are always allowed. Treat AdoptOrCreate as a
                  temporary choice for a disaster-recovery re-bootstrap: it removes the
                  protection against minting new client credentials through a typo in a
                  name, slug or pk.
                enum:
                - Create
                - Adopt
                - AdoptOrCreate
                - ReadOnly
                type: string
              members:
                description: |-
                  members are Authentik usernames. Absent: membership is never read or
                  written. Present, including []: exactly these members (the operator
                  token's own user is never removed).
                items:
                  maxLength: 150
                  minLength: 1
                  type: string
                maxItems: 1000
                type: array
                x-kubernetes-list-type: set
              name:
                description: |-
                  name is the group's name in Authentik; defaults to metadata.name. It
                  cannot change once the group is created or adopted (InvalidSpec).
                maxLength: 255
                minLength: 1
                pattern: ^[^\x00-\x1F\x7F]+$
                type: string
            type: object
            x-kubernetes-validations:
            - message: authentikRef is immutable
              rule: has(self.authentikRef) == has(oldSelf.authentikRef) && (!has(self.authentikRef)
                || self.authentikRef.name == oldSelf.authentikRef.name)
            - message: dryRun requires managementPolicy Adopt or AdoptOrCreate
              rule: '!has(self.dryRun) || !self.dryRun || (has(self.managementPolicy)
                && self.managementPolicy in [''Adopt'', ''AdoptOrCreate''])'
            - message: managementPolicy ReadOnly never deletes; deletionPolicy Delete
                is not allowed
              rule: '!(has(self.managementPolicy) && self.managementPolicy == ''ReadOnly''
                && has(self.deletionPolicy) && self.deletionPolicy == ''Delete'')'
          status:
            description: status defines the observed state of AuthentikGroup
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the resource. "Ready" is
                  True once the group in Authentik matches the spec.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              groupPk:
                description: |-
                  groupPk is the Authentik primary key (UUID) of the group this resource
                  manages, whether it created or adopted it.
                type: string
              managedAttributes:
                description: |-
                  managedAttributes lists the attribute keys the operator owns: the keys it
                  set from spec.attributes. It removes one from the group when the spec stops
                  listing it.
                items:
                  type: string
                type: array
              members:
                description: |-
                  members pins each username in spec.members to the Authentik user it
                  resolved to the first time it was resolved. A username that later resolves
                  to another user is held out (MemberIdentityChanged) until its entry is
                  removed from this list.
                items:
                  description: |-
                    GroupMemberStatus pins a member username to the Authentik user it first
                    resolved to.
                  properties:
                    pk:
                      description: |-
                        pk is the Authentik user the username resolved to when the username was
                        first resolved. The operator holds the username out if it later resolves to
                        another user.
                      format: int32
                      type: integer
                    username:
                      description: username is the member's Authentik username, as
                        listed in spec.members.
                      type: string
                  required:
                  - pk
                  - username
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - username
                x-kubernetes-list-type: map
              name:
                description: |-
                  name is the group's name in Authentik when it was created or adopted.
                  spec.name cannot change from it.
                type: string
              observedGeneration:
                description: observedGeneration is the spec generation last synced
                  to Authentik.
                format: int64
                type: integer
              pendingCreate:
                description: |-
                  pendingCreate holds the group name while a create is in flight. It lets
                  the next reconcile recognise its own group, by the ownership proof it
                  carries, if the create's outcome was lost (timeout, failed status write).
                type: string
              provenance:
                description: |-
                  provenance is Created or Adopted once decided; empty means not yet
                  decided (including while an adoption dry run is reporting).
                enum:
                - Created
                - Adopted
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
