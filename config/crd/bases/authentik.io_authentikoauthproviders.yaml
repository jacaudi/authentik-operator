---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: authentikoauthproviders.authentik.io
spec:
  group: authentik.io
  names:
    kind: AuthentikOAuthProvider
    listKind: AuthentikOAuthProviderList
    plural: authentikoauthproviders
    singular: authentikoauthprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.clientId
      name: Client ID
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.provenance
      name: Provenance
      type: string
    - jsonPath: .status.conditions[?(@.type=='CredentialsReady')].status
      name: Credentials
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuthentikOAuthProvider is the Schema for the authentikoauthproviders
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AuthentikOAuthProvider
            properties:
              accessCodeValidity:
                default: minutes=1
                description: accessCodeValidity, e.g. "minutes=1".
                pattern: ^((weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?;)*(weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?$
                type: string
              accessTokenValidity:
                default: minutes=5
                description: accessTokenValidity, e.g. "minutes=5".
                pattern: ^((weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?;)*(weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?$
                type: string
              adoption:
                description: |-
                  adoption controls whether this resource may take over a provider that
                  already exists in Authentik (for example one created by another
                  operator) instead of reporting a Conflict. See APIAdoptionSpec for
                  what adoption writes and which defaulted fields are included. An
                  adopted provider's client ID and secret are kept as they are (the
                  credentials Secret is rendered from the existing values) unless
                  spec.clientId is set. Unset optional fields (authenticationFlow,
                  encryptionKey, logoutUri, name) are left as the existing provider has
                  them. The defaulted fields adoption will write are: scopes, clientType,
                  grantTypes, accessCodeValidity, accessTokenValidity,
                  refreshTokenValidity, refreshTokenThreshold, subMode,
                  includeClaimsInIdToken, issuerMode, logoutMethod, and the
                  matchingMode and type of each redirect URI.
                properties:
                  createIfMissing:
                    default: false
                    description: |-
                      createIfMissing lets a resource with adoption enabled create the
                      object when none is found to adopt. When false (the default) a miss is
                      reported as AdoptionTargetNotFound and nothing is written, so a
                      migrating user can never mint new client credentials by a typo in the
                      name, slug or pk. A disaster-recovery re-bootstrap (the Authentik
                      database was lost, nothing exists to adopt) sets it to true
                      deliberately. With adoption disabled the resource creates as usual,
                      and a resource that created its object itself recreates it if it
                      vanishes, whatever this says. Treat it as a temporary toggle: leaving
                      it true in Git removes the typo protection. For a disaster-recovery
                      re-bootstrap, clear status.providerPk/applicationUid, provenance and
                      clientId, set this, pin spec.clientId to the old client ID if
                      consumers must keep it (the client secret is always new), and turn it
                      off again once the object exists.
                    type: boolean
                  dryRun:
                    default: false
                    description: |-
                      dryRun finds the existing object and reports, in the Ready condition
                      (reason AdoptionDryRun) and an event, which fields adoption would
                      change. Nothing is written to Authentik, and no credentials Secret is
                      rendered. Set it back to false to adopt for real. Only meaningful
                      with enabled true. dryRun gates only the initial takeover (and the
                      decision to create when createIfMissing is set): once the object is
                      adopted, spec edits are applied live whatever dryRun says.
                    type: boolean
                  enabled:
                    default: false
                    description: |-
                      enabled permits this resource to take over an existing Authentik
                      object that it did not create.
                    type: boolean
                  match:
                    description: |-
                      match selects the existing provider by name or pk. When unset, the
                      provider named like this resource's desired name (spec.name, else
                      metadata.name) is the candidate and, if there is none, a new provider
                      is created only if createIfMissing is set. A missing match is otherwise
                      an error (reason AdoptionTargetNotFound), never a create, so a
                      migration cannot silently mint new credentials.
                    properties:
                      name:
                        description: name is the provider's exact name in Authentik.
                        maxLength: 255
                        minLength: 1
                        type: string
                      pk:
                        description: pk is the provider's primary key in Authentik.
                        format: int32
                        minimum: 1
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of name or pk
                      rule: '(has(self.name) ? 1 : 0) + (has(self.pk) ? 1 : 0) ==
                        1'
                type: object
              authenticationFlow:
                description: |-
                  authenticationFlow is the slug of the flow used when an
                  unauthenticated user accesses the application. Optional.
                type: string
              authentikRef:
                description: |-
                  authentikRef names the AuthentikDeployment (same namespace) whose
                  connection this object is reconciled against. When omitted, the
                  operator's default connection is used.
                properties:
                  name:
                    description: |-
                      name of an AuthentikDeployment in the same namespace. Cross-namespace
                      references are deliberately not supported: the referenced deployment
                      carries an API token, and referencing it grants its privileges.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              authorizationFlow:
                description: authorizationFlow is the slug of the flow used when authorizing
                  this provider.
                minLength: 1
                type: string
              clientId:
                description: |-
                  clientId pins the client ID. When omitted, the operator uses a client
                  ID derived from this resource's UID ("k8s-<uid>"), reported in
                  status.clientId and never written back to spec. Client IDs are not
                  secret; the derived one lets the operator recognise its own provider
                  if a create's outcome was lost. Printable ASCII without spaces, so it
                  cannot inject keys into a rendered credentials Secret.
                maxLength: 255
                pattern: ^[\x21-\x7E]+$
                type: string
              clientType:
                default: confidential
                description: clientType is confidential (has a client secret) or public.
                enum:
                - confidential
                - public
                type: string
              deletionPolicy:
                description: |-
                  deletionPolicy is what happens to the provider in Authentik when this
                  resource is deleted: Delete or Retain. When unset: Delete for a
                  provider this resource created, Retain for an adopted one. The
                  rendered credentials Secret is a Kubernetes object owned by this
                  resource and is garbage-collected with it under either policy.
                enum:
                - Delete
                - Retain
                type: string
              encryptionKey:
                description: |-
                  encryptionKey is the name of a certificate-key pair used to encrypt
                  tokens (JWE). Optional.
                type: string
              grantTypes:
                default:
                - authorization_code
                - refresh_token
                description: |-
                  grantTypes lists the grant types the provider accepts. Always sent
                  explicitly: Authentik 2026.8+ rejects logins for providers created
                  with an empty list ("Invalid grant_type for provider"). Servers before
                  2026.8 have no such property and ignore this field.
                items:
                  description: OAuthGrantType is an OAuth2 grant type Authentik can
                    allow for a provider.
                  enum:
                  - authorization_code
                  - implicit
                  - hybrid
                  - refresh_token
                  - client_credentials
                  - password
                  - urn:ietf:params:oauth:grant-type:device_code
                  - urn:ietf:params:oauth:grant-type:token-exchange
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              includeClaimsInIdToken:
                default: true
                description: includeClaimsInIdToken includes user claims from scopes
                  in the id_token.
                type: boolean
              invalidationFlow:
                description: invalidationFlow is the slug of the flow used when ending
                  the session.
                minLength: 1
                type: string
              issuerMode:
                default: per_provider
                description: issuerMode selects how the iss claim is built.
                enum:
                - global
                - per_provider
                type: string
              logoutMethod:
                default: backchannel
                description: |-
                  logoutMethod is backchannel (server-to-server) or frontchannel
                  (browser iframes; requires logoutUri).
                enum:
                - backchannel
                - frontchannel
                type: string
              logoutUri:
                description: logoutUri is notified on logout. Optional.
                maxLength: 2048
                minLength: 1
                type: string
              name:
                description: name of the provider in Authentik. Defaults to metadata.name.
                maxLength: 255
                minLength: 1
                type: string
              propertyMappings:
                description: propertyMappings lists additional property mappings by
                  UUID or name.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              redirectUris:
                description: redirectUris lists the allowed redirect URIs.
                items:
                  description: RedirectURI is an allowed redirect URI.
                  properties:
                    matchingMode:
                      default: strict
                      description: matchingMode is strict (exact match) or regex.
                      enum:
                      - strict
                      - regex
                      type: string
                    type:
                      default: authorization
                      description: type is authorization (default) or logout (post-logout
                        redirect).
                      enum:
                      - authorization
                      - logout
                      type: string
                    url:
                      description: |-
                        url is the redirect URI, or a regular expression when matchingMode is
                        regex. Custom schemes (e.g. com.example.app:/callback) are allowed.
                      maxLength: 2048
                      minLength: 1
                      type: string
                  required:
                  - url
                  type: object
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              refreshTokenThreshold:
                default: seconds=0
                description: |-
                  refreshTokenThreshold: a refresh token valid for less than this is
                  renewed on refresh; "seconds=0" renews on every refresh.
                pattern: ^((weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?;)*(weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?$
                type: string
              refreshTokenValidity:
                default: days=30
                description: refreshTokenValidity, e.g. "days=30".
                pattern: ^((weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?;)*(weeks|days|hours|minutes|seconds|milliseconds|microseconds)=[0-9]+(\.[0-9]+)?$
                type: string
              scopes:
                default:
                - openid
                - profile
                - email
                description: |-
                  scopes lists OAuth scope mappings by scope_name (e.g. openid, profile,
                  email). When several mappings share a scope name, the managed
                  (built-in) one is used.
                items:
                  type: string
                maxItems: 64
                type: array
                x-kubernetes-list-type: set
              secret:
                description: |-
                  secret, when set, renders the provider's client credentials and
                  endpoint URLs into a Secret in this namespace (owned by this
                  resource, deleted with it).
                properties:
                  name:
                    description: |-
                      name of the Secret. Defaults to "<metadata.name>-oauth". Renaming
                      deletes the previously rendered Secret once the new one exists.
                    maxLength: 253
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  templateRef:
                    description: |-
                      templateRef names the AuthentikCredentialsTemplate that renders the
                      Secret. The template's namespaceSelector must match this namespace.
                    properties:
                      name:
                        description: name of the AuthentikCredentialsTemplate.
                        maxLength: 253
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                type: object
              signingKey:
                description: |-
                  signingKey is the name of the certificate-key pair used to sign tokens.
                  Not defaulted in the schema, so an existing provider can be adopted
                  without rewriting its key: when empty, a NEW provider is created with
                  "authentik Self-signed Certificate", and an ADOPTED provider keeps
                  whatever it has (including no signing key).
                minLength: 1
                type: string
              subMode:
                default: hashed_user_id
                description: subMode selects the value of the sub claim.
                enum:
                - hashed_user_id
                - user_id
                - user_uuid
                - user_username
                - user_email
                - user_upn
                type: string
            required:
            - authorizationFlow
            - invalidationFlow
            - redirectUris
            type: object
            x-kubernetes-validations:
            - message: authentikRef is immutable
              rule: has(self.authentikRef) == has(oldSelf.authentikRef) && (!has(self.authentikRef)
                || self.authentikRef.name == oldSelf.authentikRef.name)
            - message: logoutMethod frontchannel requires logoutUri
              rule: '!has(self.logoutMethod) || self.logoutMethod != ''frontchannel''
                || has(self.logoutUri)'
          status:
            description: status defines the observed state of AuthentikOAuthProvider
            properties:
              clientId:
                description: |-
                  clientId is the provider's client ID (generated by Authentik unless
                  spec.clientId is set). The client secret is never written to status.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the resource. "Ready" is
                  True once the provider in Authentik matches the spec.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation last synced
                  to Authentik.
                format: int64
                type: integer
              pendingCreate:
                description: |-
                  pendingCreate holds the provider name while a create is in flight. It
                  lets the next reconcile recognise its own provider if the create's
                  outcome was lost (timeout, failed status write), which a pinned
                  spec.clientId alone cannot prove: another provider could carry it.
                type: string
              provenance:
                description: |-
                  provenance is Created or Adopted once decided; empty means not yet
                  decided (including while an adoption dry run is reporting).
                enum:
                - Created
                - Adopted
                type: string
              providerPk:
                description: |-
                  providerPk is the primary key of the provider this resource manages in
                  Authentik, whether it created or adopted it.
                format: int32
                type: integer
              secretName:
                description: secretName is the Secret this resource last rendered
                  credentials into.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name is too long for the default Secret name <name>-oauth;
            set spec.secret.name
          rule: '!has(self.spec.secret) || has(self.spec.secret.name) || size(self.metadata.name)
            <= 247'
    served: true
    storage: true
    subresources:
      status: {}
