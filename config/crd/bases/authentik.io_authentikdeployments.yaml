---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: authentikdeployments.authentik.io
spec:
  group: authentik.io
  names:
    kind: AuthentikDeployment
    listKind: AuthentikDeploymentList
    plural: authentikdeployments
    singular: authentikdeployment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.mode
      name: Mode
      type: string
    - jsonPath: .status.url
      name: URL
      type: string
    - jsonPath: .status.conditions[?(@.type=='Connected')].status
      name: Connected
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuthentikDeployment is the Schema for the authentikdeployments
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AuthentikDeployment
            properties:
              adoption:
                description: |-
                  adoption controls whether this resource may take over pre-existing
                  objects that it did not create.
                properties:
                  enabled:
                    default: false
                    description: |-
                      enabled permits this AuthentikDeployment to adopt pre-existing objects
                      matching the names it manages. An adopted object gains an owner
                      reference and the operator's labels; fields the spec does not set are
                      left as they are, and on teardown the object is released rather than
                      deleted.
                    type: boolean
                type: object
              connection:
                description: |-
                  connection describes how the operator reaches this Authentik's API.
                  Required in ConnectOnly mode.
                properties:
                  caBundle:
                    description: |-
                      caBundle is an optional PEM CA bundle trusted in addition to the
                      system roots when verifying Authentik's TLS certificate.
                    properties:
                      configMapKeyRef:
                        description: |-
                          configMapKeyRef selects a ConfigMap key holding the bundle
                          (e.g. one populated by trust-manager).
                        properties:
                          key:
                            default: ca.crt
                            description: key within the ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name of the ConfigMap.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                      secretKeyRef:
                        description: |-
                          secretKeyRef selects a Secret key holding the bundle
                          (e.g. ca.crt of a cert-manager Certificate). The Secret must carry the
                          label authentik.io/connection: "true" (for cert-manager, set it via
                          the Certificate's spec.secretTemplate.labels).
                        properties:
                          key:
                            default: ca.crt
                            description: key within the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                          name:
                            description: name of the Secret.
                            maxLength: 253
                            minLength: 1
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: exactly one of configMapKeyRef or secretKeyRef must
                        be set
                      rule: has(self.configMapKeyRef) != has(self.secretKeyRef)
                  externalURL:
                    description: |-
                      externalURL is the browser-facing base URL of Authentik, used in the
                      endpoint URLs rendered into credential Secrets (issuer, authorize,
                      token, ...). Defaults to url. Set it when url is an in-cluster address
                      that applications' users cannot reach.
                    maxLength: 2048
                    pattern: ^https?://[^/?#@\s]+(/[^?#@\s]*)?$
                    type: string
                  insecureSkipVerify:
                    description: |-
                      insecureSkipVerify disables TLS certificate verification. Intended for
                      testing only.
                    type: boolean
                  tokenSecretRef:
                    description: |-
                      tokenSecretRef selects the Secret key holding an Authentik API token.
                      The Secret must be in the same namespace as the AuthentikDeployment.
                      The token is never logged or copied into any status.

                      The Secret must carry the label authentik.io/connection: "true"; the
                      operator refuses unlabeled Secrets. It reads the Secret with its own
                      privileges and sends the value to url, so the label is what stops an
                      AuthentikDeployment author from exfiltrating arbitrary Secrets.
                    properties:
                      key:
                        default: token
                        description: key within the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                      name:
                        description: name of the Secret.
                        maxLength: 253
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  url:
                    description: |-
                      url is the base URL of Authentik, e.g. https://authentik.example.com or
                      http://authentik-server.authentik.svc.cluster.local. Plain HTTP is used
                      only when the URL says http.
                    maxLength: 2048
                    pattern: ^https?://[^/?#@\s]+(/[^?#@\s]*)?$
                    type: string
                required:
                - tokenSecretRef
                - url
                type: object
                x-kubernetes-validations:
                - message: caBundle and insecureSkipVerify are mutually exclusive
                  rule: '!(has(self.insecureSkipVerify) && self.insecureSkipVerify
                    && has(self.caBundle))'
              mode:
                description: |-
                  mode selects whether this resource manages the Authentik workloads
                  (Managed) or only describes how to reach an existing Authentik
                  (ConnectOnly). There is no default: managing workloads must be asked for.
                  Immutable: switching would orphan or adopt workloads implicitly.
                enum:
                - Managed
                - ConnectOnly
                type: string
                x-kubernetes-validations:
                - message: mode is immutable
                  rule: self == oldSelf
            required:
            - mode
            type: object
            x-kubernetes-validations:
            - message: connection is required when mode is ConnectOnly
              rule: self.mode != 'ConnectOnly' || has(self.connection)
          status:
            description: status defines the observed state of AuthentikDeployment
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the AuthentikDeployment resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.

                  "Connected" reports whether the Authentik API is reachable with the
                  configured token.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              url:
                description: url is the Authentik base URL this resource resolved
                  to.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
