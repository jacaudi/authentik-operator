# This rule is not used by the project authentik-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the authentik.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: authentikcredentialstemplate-editor-role
rules:
- apiGroups:
  - authentik.io
  resources:
  - authentikcredentialstemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik.io
  resources:
  - authentikcredentialstemplates/status
  verbs:
  - get
