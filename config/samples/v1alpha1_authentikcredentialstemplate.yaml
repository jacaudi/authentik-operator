# A credentials template, owned by platform administrators. Providers that
# reference it get a Secret with these keys, labels and annotations; they
# choose only the Secret's name. Variables:
# .ClientID .ClientSecret .IssuerURL .AuthURL .TokenURL .UserInfoURL
# .LogoutURL .JWKSURL .ProviderInfoURL .Slug .Name
apiVersion: authentik.io/v1alpha1
kind: AuthentikCredentialsTemplate
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafana-generic-oauth
spec:
  template: |
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .ClientID }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .ClientSecret }}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ .AuthURL }}
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: {{ .TokenURL }}
    GF_AUTH_GENERIC_OAUTH_API_URL: {{ .UserInfoURL }}
  # labels:
  #   team: observability
  # Only providers in matching namespaces may use this template; omit to
  # allow every namespace.
  # namespaceSelector:
  #   matchLabels:
  #     kubernetes.io/metadata.name: monitoring
