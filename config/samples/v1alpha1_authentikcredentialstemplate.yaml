# A credentials template, owned by platform administrators. Providers that
# reference it get a Secret with these keys, labels and annotations; they
# choose only the Secret's name. Variables:
# .ClientID .ClientSecret .IssuerURL .AuthURL .TokenURL .UserInfoURL
# .LogoutURL .JWKSURL .ProviderInfoURL .Slug .Name
# Quote values with printf "%q": application names may contain ': ' or '#'.
apiVersion: authentik.io/v1alpha1
kind: AuthentikCredentialsTemplate
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafana-generic-oauth
spec:
  template: |
    GF_AUTH_GENERIC_OAUTH_NAME: {{ printf "%q" .Name }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ printf "%q" .ClientID }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ printf "%q" .ClientSecret }}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ printf "%q" .AuthURL }}
    GF_AUTH_GENERIC_OAUTH_TOKEN_URL: {{ printf "%q" .TokenURL }}
    GF_AUTH_GENERIC_OAUTH_API_URL: {{ printf "%q" .UserInfoURL }}
  # labels:
  #   team: observability
  # Required: which namespaces' providers may use this template ({} allows
  # all). kubernetes.io/metadata.name is set by the API server, so tenants
  # who can label their namespaces cannot spoof it.
  namespaceSelector:
    matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [monitoring]
