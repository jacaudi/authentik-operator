# An application using the sample OAuth provider. It waits until the
# provider is Ready. Both must use the same connection (authentikRef).
apiVersion: authentik.io/v1alpha1
kind: AuthentikApplication
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: grafana
spec:
  name: Grafana
  # slug defaults to metadata.name and is immutable.
  providerRef:
    name: authentikoauthprovider-sample
  metaLaunchUrl: https://grafana.example.com
  group: Monitoring
  # Defaults when the application is created (an adopted application keeps its
  # live values for any field left unset): policyEngineMode: any,
  # openInNewTab: true, metaHide: false
  #
  # Take over an application that already exists with this slug instead of
  # failing with a Conflict. Only the fields set here are patched; group,
  # meta*, policyEngineMode, openInNewTab, metaHide and the provider link (when
  # providerRef is unset) are left alone. Adopt, AdoptOrCreate and ReadOnly on
  # the operator's default connection need an administrator to allow this
  # namespace (--default-connection-adoption-namespace-selector). Start with
  # dryRun: true.
  # managementPolicy: Adopt   # Create | Adopt | AdoptOrCreate | ReadOnly
  # dryRun: true              # only with Adopt or AdoptOrCreate
  # deletionPolicy: Retain    # default for an adopted application
