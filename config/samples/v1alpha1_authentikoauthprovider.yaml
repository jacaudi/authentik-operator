# An OAuth2/OIDC provider. Only the flows and redirect URIs are required;
# everything else shows its default. Uses the operator's default connection
# unless authentikRef names an AuthentikDeployment in this namespace.
apiVersion: authentik.io/v1alpha1
kind: AuthentikOAuthProvider
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: authentikoauthprovider-sample
spec:
  # authentikRef:
  #   name: authentikdeployment-sample
  authorizationFlow: default-provider-authorization-implicit-consent
  invalidationFlow: default-provider-invalidation-flow
  redirectUris:
    - url: https://grafana.example.com/login/generic_oauth
  # Render client credentials into a Secret in this namespace. The keys come
  # from the AuthentikCredentialsTemplate; without templateRef they are
  # client-id, client-secret, issuer-url, authorization-url, token-url and
  # userinfo-url.
  secret:
    name: grafana-oidc-credentials
    templateRef:
      name: grafana-generic-oauth
  # Defaults, shown for reference:
  # scopes: [openid, profile, email]
  # grantTypes: [authorization_code, refresh_token]
  # clientType: confidential
  # subMode: hashed_user_id
  # issuerMode: per_provider
  # signingKey: unset = "authentik Self-signed Certificate" on create, kept on adopt
  #
  # Adopt a provider that already exists (for example one created by another
  # operator) instead of failing with a Conflict. Start with dryRun: true; the
  # Ready condition (reason AdoptionDryRun) lists the fields that would change.
  # The existing client ID and secret are kept and rendered into the Secret.
  # Fields with a default above (scopes, grantTypes, ...) ARE written: set
  # them to the existing provider's values first. See docs/design/scope.md.
  # adoption:
  #   enabled: true
  #   dryRun: true
  #   match:
  #     name: grafana-provider   # or: pk: 7
  #   createIfMissing: false     # true only to create when nothing matches
  # deletionPolicy: Retain       # default for an adopted provider
