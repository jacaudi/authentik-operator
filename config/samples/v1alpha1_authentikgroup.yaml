# An access group. The operator creates it (marked with an ownership proof in
# its attributes) and deletes it with this resource unless a policy binding
# still uses it; the deletion then waits, see status.conditions (DeletionBlocked).
apiVersion: authentik.io/v1alpha1
kind: AuthentikGroup
metadata:
  labels:
    app.kubernetes.io/name: authentik-operator
    app.kubernetes.io/managed-by: kustomize
  name: immich-users
spec:
  # name defaults to metadata.name and cannot change once the group exists.
  name: immich-users
  # Attributes are inherited by members in claims. The operator owns only the
  # keys listed here and keeps every other key. Values are strings, numbers,
  # booleans or lists. goauthentik.io/*, authentik_operator and settings are
  # reserved (InvalidSpec). An empty map removes the keys the operator set.
  # attributes:
  #   immich_role: admin
  #   teams: [photos, family]
  #
  # Unset: false on a group this resource created, the live value on an
  # adopted group.
  # isSuperuser: false
  #
  # Take over a group that already exists with this name instead of failing
  # with a Conflict. Only the fields set here are patched. Adopt, AdoptOrCreate
  # and ReadOnly on the operator's default connection need an administrator to
  # allow this namespace (--default-connection-adoption-namespace-selector).
  # Start with dryRun: true.
  # managementPolicy: Adopt   # Create | Adopt | AdoptOrCreate | ReadOnly
  # dryRun: true              # only with Adopt or AdoptOrCreate
  # deletionPolicy: Retain    # default for an adopted group
