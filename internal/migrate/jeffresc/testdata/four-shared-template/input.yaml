apiVersion: goauthentik.io/v1alpha1
kind: AuthentikApplication
metadata: {name: gitlab, namespace: authentik-operator-system}
spec:
  name: "GitLab"
  slug: "gitlab"
  metaLaunchUrl: "https://gitlab.example.com"
  metaDescription: "Git repository hosting"
  provider:
    authorizationFlow: "default-provider-authorization-implicit-consent"
    invalidationFlow: "default-provider-invalidation-flow"
    redirectUris: ["https://gitlab.example.com/users/auth/openid_connect/callback"]
    scopes: [openid, profile, email]
    clientType: "confidential"
    accessTokenValidity: "minutes=10"
    refreshTokenValidity: "days=30"
    subMode: "hashed_user_id"
    includeClaimsInIdToken: true
    issuerMode: "per_provider"
  secret:
    name: "gitlab-oidc-credentials"
    template: |
      OIDC_CLIENT_ID: {{ .ClientID }}
      OIDC_CLIENT_SECRET: {{ .ClientSecret }}
      OIDC_ISSUER: {{ .IssuerURL }}
      OIDC_AUTH_URL: {{ .AuthURL }}
      OIDC_TOKEN_URL: {{ .TokenURL }}
      OIDC_USERINFO_URL: {{ .UserInfoURL }}
---
