apiVersion: goauthentik.io/v1alpha1
kind: AuthentikOAuth2Application
metadata:
  name: immich
  namespace: media
  finalizers: ["goauthentik.io/finalizer"]
spec:
  name: Immich
  group: Photos
  metaPublisher: Example Co
  openInNewTab: false
  policyEngineMode: all
  provider:
    authorizationFlow: default-provider-authorization-implicit-consent
    invalidationFlow: default-provider-invalidation-flow
    redirectUris:
      - https://immich.example.com/auth/login
      - app.immich:///oauth-callback
    propertyMappings: ["11111111-2222-3333-4444-555555555555"]
    signingKey: custom-signing-key
status:
  providerId: 7
