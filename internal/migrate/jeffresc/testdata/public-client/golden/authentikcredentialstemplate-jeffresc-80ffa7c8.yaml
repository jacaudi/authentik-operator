# Cluster-scoped and administrator-owned: a platform admin applies this.
apiVersion: authentik.io/v1alpha1
kind: AuthentikCredentialsTemplate
metadata:
  name: jeffresc-80ffa7c8
spec:
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - web
  template: |
    client_id: {{ .ClientID }}
    client_secret: {{ .ClientSecret }}
    issuer: {{ .IssuerURL }}
