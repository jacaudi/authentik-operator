# Cluster-scoped and administrator-owned: a platform admin applies this.
apiVersion: authentik.io/v1alpha1
kind: AuthentikCredentialsTemplate
metadata:
  name: jeffresc-70f59156
spec:
  annotations:
    owner: platform
  labels:
    team: observability
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - monitoring
  template: |
    GF_AUTH_GENERIC_OAUTH_CLIENT_ID: {{ .ClientID }}
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: {{ .ClientSecret }}
    GF_AUTH_GENERIC_OAUTH_AUTH_URL: {{ .AuthURL }}
