# Cluster-scoped and administrator-owned: a platform admin applies this.
apiVersion: authentik.io/v1alpha1
kind: AuthentikCredentialsTemplate
metadata:
  name: oidc-env
spec:
  namespaceSelector:
    matchExpressions:
    - key: kubernetes.io/metadata.name
      operator: In
      values:
      - authentik-operator-system
  template: |
    OIDC_CLIENT_ID: {{ .ClientID }}
    OIDC_CLIENT_SECRET: {{ .ClientSecret }}
    OIDC_ISSUER: {{ .IssuerURL }}
    OIDC_AUTH_URL: {{ .AuthURL }}
    OIDC_TOKEN_URL: {{ .TokenURL }}
    OIDC_USERINFO_URL: {{ .UserInfoURL }}
