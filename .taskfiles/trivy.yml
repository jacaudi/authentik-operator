# Trivy -- image and manifest scanning. Repo-specific; not a fleet template.
# govulncheck (go:vuln) is reachability-based, so it stays quiet about a CVE in a
# dependency the code never calls. Trivy reports by version, which is what users'
# own scanners do against the published image, so both run.
#
# Trivy runs from one digest-pinned container image, so CI and a laptop need
# only Docker and run the same version. Accepted findings live in .trivyignore.
version: '3'

vars:
  TRIVY_FLAGS: --exit-code 1 --severity HIGH,CRITICAL --ignorefile /work/.trivyignore

env:
  # renovate: datasource=docker depName=aquasec/trivy
  TRIVY_VERSION: 0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb

tasks:
  config:
    desc: Scan the rendered install manifests for misconfiguration
    cmds:
      # The Makefile owns the kustomize version (see k8s:manifests).
      - make kustomize
      - |
        set -eu
        out=$(mktemp -d)
        trap 'rm -rf "${out}"' EXIT
        bin/kustomize build config/default > "${out}/install.yaml"
        docker run --rm \
          -v "${PWD}/.trivyignore:/work/.trivyignore:ro" \
          -v "${out}:/scan:ro" \
          "aquasec/trivy:${TRIVY_VERSION}" config {{.TRIVY_FLAGS}} /scan

  image:
    desc: Scan a built image for known vulnerabilities
    requires:
      vars: [IMAGE]
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      # The Docker socket lets Trivy read the image the local daemon already
      # holds (smoke has just run it), so no registry credentials are needed.
      - |
        set -eu
        docker run --rm \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -v "${PWD}/.trivyignore:/work/.trivyignore:ro" \
          "aquasec/trivy:${TRIVY_VERSION}" image {{.TRIVY_FLAGS}} --ignore-unfixed "${IMAGE}"
