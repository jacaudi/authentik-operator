apiVersion: rbac.authorization.k8s.io/v1
{{- if .Values.rbac.namespaced }}
kind: Role
{{- else }}
kind: ClusterRole
{{- end }}
metadata:
{{- if .Values.rbac.namespaced }}
  namespace: {{ .Release.Namespace }}
{{- end }}
  name: {{ include "authentik-operator.resourceName" (dict "suffix" "manager-role" "context" $) }}
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  - namespaces
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - delete
  - get
  - update
- apiGroups:
  - authentik.io
  resources:
  - authentikapplications
  - authentikdeployments
  - authentikgroups
  - authentikoauthproviders
  - authentikusers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - authentik.io
  resources:
  - authentikapplications/finalizers
  - authentikdeployments/finalizers
  - authentikgroups/finalizers
  - authentikoauthproviders/finalizers
  - authentikusers/finalizers
  verbs:
  - update
- apiGroups:
  - authentik.io
  resources:
  - authentikapplications/status
  - authentikcredentialstemplates/status
  - authentikdeployments/status
  - authentikgroups/status
  - authentikoauthproviders/status
  - authentikusers/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - authentik.io
  resources:
  - authentikcredentialstemplates
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
