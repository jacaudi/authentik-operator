{{- if .Values.crd.enabled }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    {{- if .Values.crd.keep }}
    "helm.sh/resource-policy": keep
    {{- end }}
    controller-gen.kubebuilder.io/version: v0.22.0
  name: authentikapplications.authentik.io
spec:
  group: authentik.io
  names:
    kind: AuthentikApplication
    listKind: AuthentikApplicationList
    plural: authentikapplications
    singular: authentikapplication
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.slug
      name: Slug
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.provenance
      name: Provenance
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].reason
      name: Reason
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: AuthentikApplication is the Schema for the authentikapplications
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of AuthentikApplication
            properties:
              access:
                description: |-
                  access says who may open the application: the groups bound to it
                  (Groups) or left alone by this operator (Unmanaged). It is not the
                  library section label, which is spec.group. Required unless
                  managementPolicy is ReadOnly, where it is optional and a Groups value
                  only reports drift. An application with no enabled binding is open to
                  every user unless the Authentik instance setting "Applications with no
                  policies bound can be accessed by any user" (2026.5+) is off; turning it
                  off is recommended and this operator never changes it. Under Groups the
                  application is not created, nor taken over, until at least one listed
                  group exists (Ready=False, reason WaitingForGroups).
                properties:
                  groups:
                    description: |-
                      groups are Authentik group names, resolved on every reconcile. Required
                      when type is Groups, not allowed when it is Unmanaged. Under Groups the
                      operator adds the missing group bindings before it removes the ones of
                      unlisted groups, and removes nothing while a listed group does not
                      resolve.
                    items:
                      maxLength: 255
                      minLength: 1
                      type: string
                    maxItems: 64
                    type: array
                    x-kubernetes-list-type: set
                  type:
                    description: |-
                      type is Groups (the operator binds exactly the listed groups to the
                      application) or Unmanaged (the operator never writes a binding; status
                      lists the live ones).
                    enum:
                    - Groups
                    - Unmanaged
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: groups is required when type is Groups and not allowed
                    when type is Unmanaged
                  rule: 'self.type == ''Groups'' ? (has(self.groups) && size(self.groups)
                    > 0) : !has(self.groups)'
              authentikRef:
                description: |-
                  authentikRef names the AuthentikDeployment (same namespace) whose
                  connection this object is reconciled against. When omitted, the
                  operator's default connection is used. Must match the referenced
                  provider's authentikRef.
                properties:
                  name:
                    description: |-
                      name of an AuthentikDeployment in the same namespace. Cross-namespace
                      references are deliberately not supported: the referenced deployment
                      carries an API token, and referencing it grants its privileges.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                description: |-
                  deletionPolicy is what happens to the object in Authentik when this
                  resource is deleted: Delete or Retain. When unset: Delete for an object
                  this resource created, Retain for an adopted one or one of undecided
                  provenance. An explicit Delete always wins, so it can remove an object
                  this resource did not create; a Warning event is emitted when it does so
                  for undecided provenance. ReadOnly never deletes (Delete is rejected).
                  The rendered credentials Secret is a Kubernetes object owned by this
                  resource and is garbage-collected with it under either policy.
                enum:
                - Delete
                - Retain
                type: string
              dryRun:
                description: |-
                  dryRun finds the existing object and reports, in the Ready condition
                  (reason AdoptionDryRun) and an event, which fields adoption would
                  change. Nothing is written to Authentik, and no credentials Secret is
                  rendered. Set it back to false to adopt for real. Only with
                  managementPolicy Adopt or AdoptOrCreate. dryRun gates only the initial
                  takeover (and the decision to create under AdoptOrCreate): once the
                  object is adopted, spec edits are applied live whatever dryRun says.
                type: boolean
              group:
                description: group groups applications on the user's library page.
                maxLength: 255
                type: string
              managementPolicy:
                default: Create
                description: |-
                  managementPolicy is how this resource relates to the object in
                  Authentik. Create (the default) creates it and treats an existing one as
                  a Conflict. Adopt takes over an existing object and never creates one.
                  AdoptOrCreate adopts if the object exists and creates it if not.
                  ReadOnly finds the existing object, renders the credentials Secret and
                  reports drift in the Drifted condition, and never writes to Authentik
                  or deletes the object. Adopt, AdoptOrCreate and ReadOnly on the
                  operator's default connection need an administrator to allow the
                  namespace (--default-connection-adoption-namespace-selector); with
                  spec.authentikRef they are always allowed. Treat AdoptOrCreate as a
                  temporary choice for a disaster-recovery re-bootstrap: it removes the
                  protection against minting new client credentials through a typo in a
                  name, slug or pk.
                enum:
                - Create
                - Adopt
                - AdoptOrCreate
                - ReadOnly
                type: string
              metaDescription:
                description: metaDescription is shown on the library page.
                type: string
              metaHide:
                description: |-
                  metaHide hides the application from the user's library page. Unset: false
                  on create, the live value on an adopted application.
                type: boolean
              metaIcon:
                description: metaIcon is an icon URL (http(s)) or an Authentik-relative
                  path.
                maxLength: 2048
                type: string
              metaLaunchUrl:
                description: |-
                  metaLaunchUrl is the URL opened from the library page. Must be
                  http(s). Defaults (in Authentik) to the provider's launch URL.
                maxLength: 2048
                pattern: ^https?://
                type: string
              metaPublisher:
                description: metaPublisher is shown on the library page.
                maxLength: 255
                type: string
              name:
                description: |-
                  name is the application's display name. Control characters (e.g.
                  newlines) are not allowed: the name is available to credential
                  Secret templates.
                maxLength: 255
                minLength: 1
                pattern: ^[^\x00-\x1F\x7F]+$
                type: string
              openInNewTab:
                description: |-
                  openInNewTab opens the launch URL in a new tab. Unset: true on create, the
                  live value on an adopted application.
                type: boolean
              policyEngineMode:
                description: |-
                  policyEngineMode: any (one passing policy grants access) or all. Unset:
                  any on create, the live value on an adopted application. With type Groups
                  and more than one group, all is refused: it would require membership of
                  every group.
                enum:
                - all
                - any
                type: string
              providerRef:
                description: |-
                  providerRef names the provider resource (same namespace) this
                  application uses. The application waits until the provider is Ready.
                  Optional: an application without a provider is a plain launcher link.
                properties:
                  kind:
                    default: AuthentikOAuthProvider
                    description: |-
                      kind of the provider resource. Only AuthentikOAuthProvider is
                      supported today.
                    enum:
                    - AuthentikOAuthProvider
                    type: string
                  name:
                    description: name of the provider resource in this namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              slug:
                description: |-
                  slug is the application's identifier in Authentik URLs
                  (/application/o/<slug>/). Defaults to metadata.name. The effective
                  slug is immutable (setting it to metadata.name later is allowed).
                maxLength: 50
                pattern: ^[-a-zA-Z0-9_]+$
                type: string
            required:
            - name
            type: object
            x-kubernetes-validations:
            - message: authentikRef is immutable
              rule: has(self.authentikRef) == has(oldSelf.authentikRef) && (!has(self.authentikRef)
                || self.authentikRef.name == oldSelf.authentikRef.name)
            - message: spec.access is required unless managementPolicy is ReadOnly
              rule: has(self.access) || (has(self.managementPolicy) && self.managementPolicy
                == 'ReadOnly')
            - message: policyEngineMode all with more than one access group would
                require membership of every group; use any
              rule: '!(has(self.policyEngineMode) && self.policyEngineMode == ''all''
                && has(self.access) && self.access.type == ''Groups'' && size(self.access.groups)
                > 1)'
            - message: dryRun requires managementPolicy Adopt or AdoptOrCreate
              rule: '!has(self.dryRun) || !self.dryRun || (has(self.managementPolicy)
                && self.managementPolicy in [''Adopt'', ''AdoptOrCreate''])'
            - message: managementPolicy ReadOnly never deletes; deletionPolicy Delete
                is not allowed
              rule: '!(has(self.managementPolicy) && self.managementPolicy == ''ReadOnly''
                && has(self.deletionPolicy) && self.deletionPolicy == ''Delete'')'
          status:
            description: status defines the observed state of AuthentikApplication
            properties:
              access:
                description: |-
                  access is what the operator last read about the application's policy
                  bindings.
                properties:
                  bindings:
                    description: |-
                      bindings lists every live policy binding of the application, whoever
                      created it, as "group <name>", "user <username>" or "policy <name>" with
                      the suffixes " (negated)", " (expiring)" and " (disabled)" where they
                      apply. User, policy, expiring and (under policyEngineMode all) negated
                      bindings are never changed by the operator.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                type: object
              applicationUid:
                description: |-
                  applicationUid is the Authentik primary key (UUID) of the application
                  this resource manages, whether it created or adopted it.
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the resource. "Ready" is
                  True once the application in Authentik matches the spec.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the spec generation last synced
                  to Authentik.
                format: int64
                type: integer
              pendingCreate:
                description: |-
                  pendingCreate holds the slug while a create is in flight. It lets the
                  next reconcile recognise its own application if the create's outcome
                  was lost (timeout, failed status write) without trusting anything
                  another resource could also claim.
                type: string
              provenance:
                description: |-
                  provenance is Created or Adopted once decided; empty means not yet
                  decided (including while an adoption dry run is reporting).
                enum:
                - Created
                - Adopted
                type: string
              providerPk:
                description: providerPk is the primary key of the provider currently
                  assigned.
                format: int32
                type: integer
              slug:
                description: slug is the application's slug in Authentik.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: metadata.name is not a valid slug (letters, digits, - and _; max
            50); set spec.slug
          rule: has(self.spec.slug) || self.metadata.name.matches('^[-a-zA-Z0-9_]{1,50}$')
        - message: slug is immutable (it is the application's identity in Authentik
            URLs)
          rule: '(has(self.spec.slug) ? self.spec.slug : self.metadata.name) == (has(oldSelf.spec.slug)
            ? oldSelf.spec.slug : oldSelf.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
{{- end }}
