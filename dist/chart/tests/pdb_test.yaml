suite: poddisruptionbudget
templates:
  - pdb.yaml
tests:
  - it: is off by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders with maxUnavailable 1 when enabled
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.selector.matchLabels.control-plane
          value: controller-manager

  - it: prefers minAvailable when given
    set:
      podDisruptionBudget.enabled: true
      podDisruptionBudget.minAvailable: 1
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable
