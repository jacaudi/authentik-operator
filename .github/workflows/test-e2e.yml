name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Installs the official Authentik chart at each pinned version into a kind
  # cluster, installs the operator from dist/chart, and runs the Ginkgo suite
  # in test/e2e against that real server (docs/roadmap/TASK-08). One job, one
  # cluster, per Authentik version.
  test-e2e:
    name: e2e (Authentik ${{ matrix.authentik }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Chart version == Authentik version. An older supported release in
        # the 2026.2 line, and the latest 2026.8 release.
        # renovate: datasource=helm depName=authentik registryUrl=https://charts.goauthentik.io
        authentik: ["2026.2.3", "2026.8.5"]
    env:
      # The kind version is pinned in the taskfile (`task e2e`), not here.
      KIND_CLUSTER: authentik-operator-test-e2e
      AUTHENTIK_CHART_VERSION: ${{ matrix.authentik }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Set up Task
        uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e # v2.2.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify tool versions
        run: |
          helm version --short
          kubectl version --client
      # `task e2e` installs the pinned kind into bin/ and runs the suite; run
      # it locally with AUTHENTIK_CHART_VERSION set to reproduce one matrix leg.
      - name: Run e2e tests
        run: task e2e
      - name: Collect cluster state on failure
        if: failure()
        run: |
          kubectl --context "kind-${KIND_CLUSTER}" get pods -A -o wide || true
          kubectl --context "kind-${KIND_CLUSTER}" -n authentik logs deploy/authentik-server --tail=200 || true
          kubectl --context "kind-${KIND_CLUSTER}" -n authentik logs deploy/authentik-worker --tail=200 || true
      - name: Delete the kind cluster
        if: always()
        run: bin/kind delete cluster --name "${KIND_CLUSTER}" || true
